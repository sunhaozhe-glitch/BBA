    "/v1/tasks/{id}/plan-proposals/{proposal_id}/materialize": {
      "post": {
        "operationId": "materializePlanProposal",
        "summary": "Materialize approved proposal into persistent kernel work",
        "description": "Explicit proposal-mode command gated by proposal-execution. Validates approval, digest, authorization revision, scope, budget, expiry and dependencies in the local transaction. Creates immutable applications and fenced work items; sends nothing. Legacy apply remains intent-only.",
        "tags": ["Tasks", "Models"],
        "security": [{ "OperatorSession": [], "CsrfHeader": [] }, { "OperatorBearer": [] }],
        "parameters": [{ "$ref": "#/components/parameters/ResourceId" }, { "name": "proposal_id", "in": "path", "required": true, "schema": { "$ref": "./schemas/common.json#/Id" } }, { "$ref": "#/components/parameters/IdempotencyKey" }, { "$ref": "#/components/parameters/CsrfToken" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "./schemas/product.json#/MaterializeRequest" } } } },
        "responses": {
          "202": { "description": "Durable materialization accepted. All external work still passes Reserve, permit and bridge gates.", "content": { "application/json": { "schema": { "$ref": "./schemas/tasks.json#/ReceiptEnvelope" } } } },
          "default": { "$ref": "#/components/responses/ContractError" }
        }
      }
    },
