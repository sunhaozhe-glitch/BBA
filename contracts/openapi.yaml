        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "./schemas/tasks.json#/CreateTaskRequest" } } }, "description": "Strict group.acquire requires a non-empty explicit fixed candidate import. Keyword search is not an implicit source." },
