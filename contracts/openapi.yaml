    "securitySchemes": {
      "OperatorSession": { "type": "apiKey", "in": "cookie", "name": "artex_token", "description": "Existing console operator session cookie; HttpOnly, Secure, SameSite. Browser mutations additionally require X-CSRF-Token. QQ login is a separate backend-proxied control plane; this cookie contains no NapCat credential." },
      "OperatorBearer": { "type": "http", "scheme": "bearer", "bearerFormat": "opaque", "description": "Trusted CLI operator authentication; never send credentials in query strings." },
      "TaskEntryCredential": { "type": "http", "scheme": "bearer", "bearerFormat": "opaque", "description": "Per-runtime task-entry service identity. Permitted only for task creation, current task status, and pause/cancel. Every request must include the originating QQ account ID and sender ID from the authenticated platform event; the Task Engine verifies the runtime/account binding and configured sender-to-principal/account mapping. It grants no account administration, capability enumeration, reconciliation, result/evidence access, plan access, start/resume, or QQ action authority." },
      "CsrfHeader": { "type": "apiKey", "in": "header", "name": "X-CSRF-Token", "description": "Required in conjunction with OperatorSession on every browser mutation; validated against the operator session by the backend." },
      "RuntimeCredential": { "type": "http", "scheme": "bearer", "bearerFormat": "opaque", "description": "Per-runtime service credential, bound to assigned account/workspace and owner epoch." },
      "BridgeCredential": { "type": "http", "scheme": "bearer", "bearerFormat": "opaque", "description": "Per-bridge service credential, bound to runtime/account and allowed action family." },
      "ModelWorkloadCredential": { "type": "http", "scheme": "bearer", "bearerFormat": "opaque", "description": "Workload identity with model operation and budget scope; cannot invoke QQ writes." },
      "NapCatWebUICredential": { "type": "http", "scheme": "bearer", "bearerFormat": "opaque", "description": "Short-lived credential exchanged server-side from the NapCat WebUI token. Secrets must never enter browser storage, model context, or ordinary logs." }
    },
    "parameters": {
      "ResourceId": { "name": "id", "in": "path", "required": true, "schema": { "$ref": "./schemas/common.json#/Id" } },
      "Cursor": { "name": "cursor", "in": "query", "required": false, "schema": { "type": "string", "minLength": 1, "maxLength": 512 } },
      "Limit": { "name": "limit", "in": "query", "required": false, "schema": { "type": "integer", "minimum": 1, "maximum": 100, "default": 50 } },
      "TaskEntryAccount": { "name": "X-QQ-Account-ID", "in": "header", "required": false, "x-required-with-security": "TaskEntryCredential", "description": "Required with TaskEntryCredential. The task-entry runtime inserts the QQ account that received the authenticated platform event; clients cannot supply this as command text. Backend verifies it belongs to the calling runtime and allowed task scope.", "schema": { "$ref": "./schemas/common.json#/QQId" } },
      "TaskEntrySender": { "name": "X-QQ-Sender-ID", "in": "header", "required": false, "x-required-with-security": "TaskEntryCredential", "description": "Required with TaskEntryCredential. The task-entry runtime inserts the sender ID from authenticated event context; backend verifies its configured principal/account mapping and never trusts a nickname.", "schema": { "$ref": "./schemas/common.json#/QQId" } },
      "IdempotencyKey": { "name": "Idempotency-Key", "in": "header", "required": true, "schema": { "type": "string", "minLength": 1, "maxLength": 128 } },
      "CsrfToken": { "name": "X-CSRF-Token", "in": "header", "required": false, "description": "Required with cookie-authenticated browser mutations; not required for bearer-authenticated CLI or machine calls.", "schema": { "type": "string", "minLength": 16, "maxLength": 512 } },
      "ChatPermitId": { "name": "permit_id", "in": "path", "required": true, "schema": { "$ref": "./schemas/common.json#/Id" } },
      "ChatAccountId": { "name": "account_id", "in": "path", "required": true, "schema": { "$ref": "./schemas/common.json#/Id" } },
      "ChatGroupId": { "name": "group_id", "in": "path", "required": true, "schema": { "$ref": "./schemas/common.json#/QQId" } },
      "AccountIdQuery": { "name": "account_id", "in": "query", "required": true, "schema": { "$ref": "./schemas/common.json#/Id" } },
      "ConversationKindQuery": { "name": "conversation_kind", "in": "query", "required": true, "schema": { "type": "string", "enum": ["group", "private"] } },
      "ConversationIdQuery": { "name": "conversation_id", "in": "query", "required": true, "schema": { "$ref": "./schemas/common.json#/QQId" } },
      "GroupIdQuery": { "name": "group_id", "in": "query", "required": true, "schema": { "$ref": "./schemas/common.json#/QQId" } },
      "SummaryIdQuery": { "name": "summary_id", "in": "query", "required": false, "description": "Exact stored Summary.v1 id, 64 lowercase hex characters. Omit to read the newest live version for the account/group.", "schema": { "type": "string", "pattern": "^[0-9a-f]{64}$", "maxLength": 64 } },
      "SummaryVersionQuery": { "name": "summary_version", "in": "query", "required": false, "description": "Exact stored version number. Required together with summary_id and must be positive; supplying it without summary_id is a validation error, never an implicit newest-version read.", "schema": { "type": "integer", "minimum": 1 } }
    },
    "responses": {
      "ContractError": { "description": "Contract error; retryable describes delivery of the same idempotent HTTP request only and never authorizes replay of a QQ action.", "content": { "application/json": { "schema": { "$ref": "./schemas/common.json#/ErrorEnvelope" } } } }
    }
  }
