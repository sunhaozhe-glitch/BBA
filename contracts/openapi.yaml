    "/v1/login-sessions/{session_id}/qr": {"parameters": [{"name": "session_id", "in": "path", "required": true, "schema": {"$ref": "./schemas/common.json#/Id"}}], "post": {"operationId": "refreshLoginQR", "summary": "Issue or refresh the short-lived QR image (generation fence)", "tags": ["Accounts"], "security": [{"OperatorSession": [], "CsrfHeader": []}, {"OperatorBearer": []}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./schemas/login.json#/LoginGenerationRequest"}}}}, "responses": {"200": {"description": "Login session with short-lived QR.", "content": {"application/json": {"schema": {"$ref": "./schemas/login.json#/LoginSessionEnvelope"}}}}, "400": {"$ref": "#/components/responses/ContractError"}, "401": {"$ref": "#/components/responses/ContractError"}, "403": {"$ref": "#/components/responses/ContractError"}, "404": {"$ref": "#/components/responses/ContractError"}, "409": {"$ref": "#/components/responses/ContractError"}, "502": {"$ref": "#/components/responses/ContractError"}, "503": {"$ref": "#/components/responses/ContractError"}}, "parameters": [{"$ref": "#/components/parameters/IdempotencyKey"}, {"$ref": "#/components/parameters/CsrfToken"}]}},
    "/v1/login-sessions/{session_id}/poll": {"parameters": [{"name": "session_id", "in": "path", "required": true, "schema": {"$ref": "./schemas/common.json#/Id"}}], "post": {"operationId": "pollLoginSession", "summary": "Poll provider state; fenced durable transition", "tags": ["Accounts"], "security": [{"OperatorSession": [], "CsrfHeader": []}, {"OperatorBearer": []}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./schemas/login.json#/LoginGenerationRequest"}}}}, "responses": {"200": {"description": "Login session after the poll.", "content": {"application/json": {"schema": {"$ref": "./schemas/login.json#/LoginSessionEnvelope"}}}}, "400": {"$ref": "#/components/responses/ContractError"}, "401": {"$ref": "#/components/responses/ContractError"}, "403": {"$ref": "#/components/responses/ContractError"}, "404": {"$ref": "#/components/responses/ContractError"}, "409": {"$ref": "#/components/responses/ContractError"}, "502": {"$ref": "#/components/responses/ContractError"}, "503": {"$ref": "#/components/responses/ContractError"}}, "parameters": [{"$ref": "#/components/parameters/IdempotencyKey"}, {"$ref": "#/components/parameters/CsrfToken"}]}},
