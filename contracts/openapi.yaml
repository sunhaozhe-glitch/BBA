{
  "openapi": "3.0.3",
  "info": {
    "title": "QQ Automation Task and Bridge API",
    "version": "1.0.0",
    "description": "P0-01 normative contract. Contracts precede implementations. P0-12 and later live QQ behavior remain separately approval-gated. submitted, pending and unknown never count as success; any effect that may still occur retains its goal slot and target claim, including after timeout or 24 hours. Retry or account reassignment requires authoritative proof of no effect."
  },
  "x-contract-decisions": {
    "plugin_id": "napcat-plugin-cleaner",
    "strict_group_acquire_candidate_source": "fixed_import_only",
    "pending_unknown_timeout": "retain_slot_and_claim_until_authoritative_resolution",
    "character_mvp_isolation": "one_runtime_and_database_per_character_enabled_account",
    "napcat_login": "console_backend_proxy_only",
    "writer_switch": "read_only_shadow_then_stop_drain_reconcile_single_owner",
    "audit_truth": "postgresql_persistent_event_and_operation_ledger",
    "artex_source_copy": "license_review_required_before_any_copy",
    "model_and_runtime_evidence": "installed_versions_and_readback_only"
  },
  "x-ref-policy": "All schema refs are local files under contracts/schemas. Remote, absolute, parent-traversing and symlink-escaping refs are forbidden.",
  "tags": [
    { "name": "Accounts", "description": "Accounts and account-control projections." },
    { "name": "Tasks", "description": "Task creation, status, event, and control operations." },
    { "name": "Capabilities", "description": "Verified adapter capabilities per account." },
    { "name": "Runtime", "description": "Authenticated runtime liveness and observations." },
    { "name": "Bridge", "description": "Persistent execution and read-only reconciliation operations." },
    { "name": "Chat", "description": "P0-15 text-only chat triggers, permits and active-speaker policy. Chat permits are independent of task permits and grant no group-management action." },
    { "name": "Models", "description": "Authenticated bounded model requests; model output cannot grant execution permission." },
    { "name": "Summaries", "description": "Runtime Summary.v1 ingest and read-only GroupContext projection. Context is untrusted reference data; permits and the daily budget gate remain authoritative." },
    { "name": "Graph Sync", "description": "Durable ARTEX fact/goal synchronization, bounded planning snapshots, and explicit reconciliation." },
    { "name": "Operator", "description": "Read-only runtime diagnostics and scoped account/group reports." },
    { "name": "NapCat Plugin", "description": "Actual local plugin registration ID. Server-side adapter only. Live use requires the separate P0-12/P0-13 approval gates." }
  ],
  "paths": {
    "/v1/operator/runtime": {
      "get": {
        "operationId": "getOperatorRuntime",
        "summary": "Read bounded runtime, schema, worker and model readiness diagnostics",
        "tags": ["Operator"],
        "security": [{ "OperatorSession": [] }, { "OperatorBearer": [] }],
        "responses": {
          "200": { "description": "Sanitized diagnostics; no provider URL, API key, token or credential material.", "content": { "application/json": { "schema": { "$ref": "./schemas/runtime.json#/OperatorRuntimeEnvelope" } } } },
          "401": { "$ref": "#/components/responses/ContractError" },
          "403": { "$ref": "#/components/responses/ContractError" },
          "503": { "$ref": "#/components/responses/ContractError" }
        }
      }
    },
    "/v1/accounts/{account_id}/groups/{group_id}/context": {
      "parameters": [
        { "name": "account_id", "in": "path", "required": true, "schema": { "$ref": "./schemas/common.json#/Id" } },
        { "name": "group_id", "in": "path", "required": true, "schema": { "$ref": "./schemas/common.json#/QQId" } }
      ],
      "get": {
        "operationId": "getOperatorGroupContextReport",
        "summary": "Read stored GroupContext without runtime impersonation",
        "tags": ["Operator", "Summaries"],
        "security": [{ "OperatorSession": [] }, { "OperatorBearer": [] }],
        "parameters": [
          { "name": "summary_id", "in": "query", "required": false, "schema": { "type": "string", "pattern": "^[0-9a-f]{64}$" } },
          { "name": "summary_version", "in": "query", "required": false, "schema": { "type": "integer", "minimum": 1 } }
        ],
        "responses": {
          "200": { "description": "Read-only newest live Summary or exact pinned version; workspace/account scopes enforced.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/GroupContextReportEnvelope" } } } },
          "401": { "$ref": "#/components/responses/ContractError" },
          "403": { "$ref": "#/components/responses/ContractError" },
          "404": { "$ref": "#/components/responses/ContractError" },
          "405": { "$ref": "#/components/responses/ContractError" }
        }
      }
    },
    "/v1/tasks/{task_id}/graph-sync": {"parameters": [{"name": "task_id", "in": "path", "required": true, "schema": {"$ref": "./schemas/common.json#/Id"}}], "get": {"operationId": "getGraphSyncStatus", "summary": "Durable ARTEX graph-sync projection; never contacts ARTEX", "tags": ["Graph Sync"], "security": [{"OperatorSession": []}, {"OperatorBearer": []}], "responses": {"200": {"description": "Per-graph sync state, outbox counters, checkpoints and provider wiring.", "content": {"application/json": {"schema": {"$ref": "./schemas/graph.json#/GraphSyncStatusEnvelope"}}}}, "401": {"$ref": "#/components/responses/ContractError"}, "403": {"$ref": "#/components/responses/ContractError"}, "404": {"$ref": "#/components/responses/ContractError"}, "500": {"$ref": "#/components/responses/ContractError"}, "503": {"$ref": "#/components/responses/ContractError"}}}},
    "/v1/tasks/{task_id}/graph-sync/roots/{graph_kind}": {"parameters": [{"name": "task_id", "in": "path", "required": true, "schema": {"$ref": "./schemas/common.json#/Id"}}, {"name": "graph_kind", "in": "path", "required": true, "schema": {"type": "string", "enum": ["fact", "goal"]}}], "put": {"operationId": "bindTaskGraphRoot", "summary": "Bind one graph kind to one external ARTEX task id; explicit and idempotent", "description": "Creates or replays the explicit root binding. Rebinding to a different external root is refused once the task has sync state for that kind, and one external root cannot back two local tasks. A goal binding requires writes to be enabled.", "tags": ["Graph Sync"], "security": [{"OperatorSession": []}, {"OperatorBearer": []}], "parameters": [{"name": "Idempotency-Key", "in": "header", "required": true, "schema": {"type": "string", "minLength": 1, "maxLength": 128}, "description": "Reusing the key with a different body is IDEMPOTENCY_CONFLICT."}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./schemas/graph.json#/GraphRootRequest"}}}}, "responses": {"200": {"description": "The binding was created or replayed; body is the full status projection.", "content": {"application/json": {"schema": {"$ref": "./schemas/graph.json#/GraphSyncStatusEnvelope"}}}}, "400": {"$ref": "#/components/responses/ContractError"}, "401": {"$ref": "#/components/responses/ContractError"}, "403": {"$ref": "#/components/responses/ContractError"}, "404": {"$ref": "#/components/responses/ContractError"}, "409": {"$ref": "#/components/responses/ContractError"}, "500": {"$ref": "#/components/responses/ContractError"}, "503": {"$ref": "#/components/responses/ContractError"}}}},
    "/v1/tasks/{task_id}/graph-sync/planning-snapshots": {"parameters": [{"name": "task_id", "in": "path", "required": true, "schema": {"$ref": "./schemas/common.json#/Id"}}], "get": {"operationId": "listGraphPlanningSnapshots", "summary": "Newest 20 bounded planning snapshots for a task", "tags": ["Graph Sync"], "security": [{"OperatorSession": []}, {"OperatorBearer": []}], "responses": {"200": {"description": "Snapshot list, newest first.", "content": {"application/json": {"schema": {"$ref": "./schemas/graph.json#/GraphPlanningSnapshotListEnvelope"}}}}, "401": {"$ref": "#/components/responses/ContractError"}, "403": {"$ref": "#/components/responses/ContractError"}, "404": {"$ref": "#/components/responses/ContractError"}, "500": {"$ref": "#/components/responses/ContractError"}, "503": {"$ref": "#/components/responses/ContractError"}}}, "post": {"operationId": "createGraphPlanningSnapshot", "summary": "Build one bounded planning snapshot from the current fact graph, Summary versions and anchors", "description": "Reads ARTEX once, then revalidates the basis inside the writing transaction. It never enqueues an action and never calls the sender; candidates are inputs for proposal validation only.", "tags": ["Graph Sync"], "security": [{"OperatorSession": []}, {"OperatorBearer": []}], "parameters": [{"name": "Idempotency-Key", "in": "header", "required": true, "schema": {"type": "string", "minLength": 1, "maxLength": 128}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false}}}}, "responses": {"201": {"description": "The stored snapshot; a replay returns the identical snapshot without spending a round.", "content": {"application/json": {"schema": {"$ref": "./schemas/graph.json#/GraphPlanningSnapshotEnvelope"}}}}, "400": {"$ref": "#/components/responses/ContractError"}, "401": {"$ref": "#/components/responses/ContractError"}, "403": {"$ref": "#/components/responses/ContractError"}, "404": {"$ref": "#/components/responses/ContractError"}, "409": {"$ref": "#/components/responses/ContractError"}, "429": {"$ref": "#/components/responses/ContractError"}, "500": {"$ref": "#/components/responses/ContractError"}, "503": {"$ref": "#/components/responses/ContractError"}}}},
    "/v1/tasks/{task_id}/graph-sync/planning-snapshots/{snapshot_id}": {"parameters": [{"name": "task_id", "in": "path", "required": true, "schema": {"$ref": "./schemas/common.json#/Id"}}, {"name": "snapshot_id", "in": "path", "required": true, "schema": {"$ref": "./schemas/common.json#/Id"}}], "get": {"operationId": "getGraphPlanningSnapshot", "summary": "Read one planning snapshot (state may already be stale/expired/consumed)", "tags": ["Graph Sync"], "security": [{"OperatorSession": []}, {"OperatorBearer": []}], "responses": {"200": {"description": "The snapshot.", "content": {"application/json": {"schema": {"$ref": "./schemas/graph.json#/GraphPlanningSnapshotEnvelope"}}}}, "401": {"$ref": "#/components/responses/ContractError"}, "403": {"$ref": "#/components/responses/ContractError"}, "404": {"$ref": "#/components/responses/ContractError"}, "500": {"$ref": "#/components/responses/ContractError"}, "503": {"$ref": "#/components/responses/ContractError"}}}},
    "/v1/tasks/{task_id}/graph-sync/outbox/{item_id}/reconcile": {"parameters": [{"name": "task_id", "in": "path", "required": true, "schema": {"$ref": "./schemas/common.json#/Id"}}, {"name": "item_id", "in": "path", "required": true, "schema": {"$ref": "./schemas/common.json#/Id"}}], "post": {"operationId": "reconcileGraphSyncOutboxItem", "summary": "Resolve one ambiguous goal write by readback; never resends the mutation", "description": "Only a needs_reconcile item can be reconciled, and only with a claim the provider's current goal list verifies. A repeated request replays the stored result.", "tags": ["Graph Sync"], "security": [{"OperatorSession": []}, {"OperatorBearer": []}], "parameters": [{"name": "Idempotency-Key", "in": "header", "required": true, "schema": {"type": "string", "minLength": 1, "maxLength": 128}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "./schemas/graph.json#/GraphSyncReconcileRequest"}}}}, "responses": {"200": {"description": "The reconciled outbox item (sent or canceled).", "content": {"application/json": {"schema": {"$ref": "./schemas/graph.json#/GraphSyncOutboxItemEnvelope"}}}}, "400": {"$ref": "#/components/responses/ContractError"}, "401": {"$ref": "#/components/responses/ContractError"}, "403": {"$ref": "#/components/responses/ContractError"}, "404": {"$ref": "#/components/responses/ContractError"}, "409": {"$ref": "#/components/responses/ContractError"}, "500": {"$ref": "#/components/responses/ContractError"}, "503": {"$ref": "#/components/responses/ContractError"}}}},
    "/v1/login/status": {"get": {"operationId": "getLoginStatus", "summary": "Provider mode and login session limits", "tags": ["Accounts"], "security": [{"OperatorSession": []}, {"OperatorBearer": []}], "responses": {"200": {"description": "Login provider status.", "content": {"application/json": {"schema": {"$ref": "./schemas/login.json#/LoginStatusEnvelope"}}}}, "401": {"$ref": "#/components/responses/ContractError"}, "403": {"$ref": "#/components/responses/ContractError"}, "503": {"$ref": "#/components/responses/ContractError"}}}},
    "/v1/accounts/{account_id}/login-sessions": {"parameters": [{"name": "account_id", "in": "path", "required": true, "schema": {"$ref": "./schemas/common.json#/Id"}}], "get": {"operationId": "listLoginSessions", "summary": "List durable login sessions for an account", "tags": ["Accounts"], "security": [{"OperatorSession": []}, {"OperatorBearer": []}], "responses": {"200": {"description": "Login session list.", "content": {"application/json": {"schema": {"$ref": "./schemas/login.json#/LoginSessionPageEnvelope"}}}}, "401": {"$ref": "#/components/responses/ContractError"}, "403": {"$ref": "#/components/responses/ContractError"}, "404": {"$ref": "#/components/responses/ContractError"}, "503": {"$ref": "#/components/responses/ContractError"}}}, "post": {"operationId": "createLoginSession", "summary": "Create a scoped CREATED login session", "tags": ["Accounts"], "security": [{"OperatorSession": [], "CsrfHeader": []}, {"OperatorBearer": []}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false}}}}, "responses": {"201": {"description": "Created login session.", "content": {"application/json": {"schema": {"$ref": "./schemas/login.json#/LoginSessionEnvelope"}}}}, "400": {"$ref": "#/components/responses/ContractError"}, "401": {"$ref": "#/components/responses/ContractError"}, "403": {"$ref": "#/components/responses/ContractError"}, "404": {"$ref": "#/components/responses/ContractError"}, "409": {"$ref": "#/components/responses/ContractError"}, "503": {"$ref": "#/components/responses/ContractError"}}, "parameters": [{"$ref": "#/components/parameters/IdempotencyKey"}, {"$ref": "#/components/parameters/CsrfToken"}]}},
