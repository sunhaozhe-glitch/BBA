[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bba-controller"
version = "0.1.0"
description = "Isolated BBA development controller (phase 1)"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0", "jsonschema==4.26.0"]

[project.scripts]
bba-controller-debug = "bba_controller.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
